nt-size="18" font-weight="400" text-anchor="start" fill="#111">Для черновика эти три поля необязательны. Поля по предметной области: insulation_type и thickness_mm.</text><text x="70" y="1030" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111">Все внешние ключи: ON DELETE RESTRICT. status: draft / published / deleted.</text></svg>